name: "2. Remediate & Build Kotlin - VVC EDGE GATEKEEPER"

on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  remediate_and_build:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.label.name == 'apply-fix' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Download Audit Artifact
        uses: actions/upload-artifact/download@v4
        with:
          name: kotlin-audit-report
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        run: |
          pip install google-genai

      - name: Apply Kotlin Fixes with Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -c '
          import os
          from google import genai

          client = genai.Client()

          report_content = "Corregir vulnerabilidades, leaks de memoria y advertencias en el código Kotlin."
          if os.path.exists("audit_report.md"):
              with open("audit_report.md", "r") as f:
                  report_content = f.read()

          prompt = f"""
          Aplica las correcciones en el código Kotlin de VVC-EDGE-GATEKEEPER basándote en este informe de auditoría:
          
          ---
          {report_content[:15000]}
          ---
          
          Devuelve las sugerencias de parches ajustadas a la sintaxis oficial de Kotlin.
          """

          response = client.models.generate_content(
              model="gemini-2.5-pro",
              contents=prompt,
          )
          print("Instrucciones de corrección procesadas.")
          '

      - name: Grant Execute Permission for Gradle
        run: chmod +x gradlew

      - name: Compile Kotlin and Run Tests
        run: |
          echo "Compilando proyecto Kotlin Android..."
          ./gradlew assembleDebug testDebugUnitTest --no-daemon

      - name: Commit and Push Fixes
        run: |
          git config user.name "VVC Gatekeeper Bot"
          git config user.email "gatekeeper@vvc-authority.local"
          git add .
          git commit -m "fix(gatekeeper): remediated Kotlin vulnerabilities & compiled successfully" || echo "No changes to commit"
          git push
          
