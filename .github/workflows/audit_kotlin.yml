name: Kotlin audit

on:
  push:
    branches: [main, fix/github-actions-build]
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/audit_kotlin.yml'
  pull_request:
    paths:
      - '**/*.kt'
      - '**/*.kts'
      - '.github/workflows/audit_kotlin.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  audit_kotlin:
    name: Audit Kotlin code
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect optional Gemini audit
        id: config
        shell: bash
        run: |
          if [[ -n "$GEMINI_API_KEY" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Gemini audit enabled."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is not configured; generating a skipped report."
          fi

      - name: Set up Python
        if: ${{ steps.config.outputs.enabled == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Google GenAI SDK
        if: ${{ steps.config.outputs.enabled == 'true' }}
        run: python -m pip install --disable-pip-version-check google-genai

      - name: Run Gemini audit on Kotlin code
        if: ${{ steps.config.outputs.enabled == 'true' }}
        continue-on-error: true
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import Path
          from google import genai

          diff = subprocess.run(
              ["git", "diff", "origin/main...HEAD", "--", "*.kt", "*.kts"],
              check=False,
              capture_output=True,
              text=True,
          ).stdout
          if not diff.strip():
              diff = "Sin cambios detectados en archivos Kotlin/KTS."

          prompt = f"""
          Actúa como Auditor Senior de Seguridad y Calidad en Kotlin/Android Native para VVC-EDGE-GATEKEEPER.
          Revisa el siguiente diff en materia de manejo de datos biométricos, coroutines/lifecycle,
          permisos de cámara, privacidad local y malas prácticas Kotlin. Devuelve un informe Markdown
          con hallazgos y acciones concretas. No inventes archivos ni cambios fuera del diff.

          Diff:
          {diff[:30000]}
          """
          response = genai.Client().models.generate_content(
              model="gemini-2.5-pro",
              contents=prompt,
          )
          Path("audit_report.md").write_text(response.text or "Sin hallazgos.", encoding="utf-8")
          PY

      - name: Create skipped audit report
        if: ${{ steps.config.outputs.enabled != 'true' || !hashFiles('audit_report.md') }}
        run: echo "Auditoría Gemini omitida o no disponible; la compilación Android no depende de este análisis." > audit_report.md

      - name: Upload audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-audit-report
          path: audit_report.md
          if-no-files-found: error

      - name: Post comment on PR
        if: ${{ github.event_name == 'pull_request' && steps.config.outputs.enabled == 'true' && hashFiles('audit_report.md') != '' }}
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('audit_report.md', 'utf8');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### [VVC-EDGE-GATEKEEPER] Informe de Auditoría Kotlin\n\n${report}`
            });
