name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Hotfix Manus Gradle Versions
      run: |
        echo "=== CORRIGIENDO COMPATIBILIDAD DE GRADLE ==="
        sed -i 's/version "8.2.2"/version "8.1.4"/g' build.gradle.kts || true
        sed -i 's/version "1.9.22"/version "1.8.10"/g' build.gradle.kts || true

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1

    - name: Clean and Compile App
      run: |
        chmod +x gradlew
        ./gradlew :app:assembleDebug --no-daemon --stacktrace
        
