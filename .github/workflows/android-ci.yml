name: Android CI

on:
  push:
    branches: [ "main", "vvc/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Environment
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

      - name: Clean and Compile App
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all
