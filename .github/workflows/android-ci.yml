name: Android CI

on:
  push:
    branches: [ "main", "vvc/**" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Gradle Environment
vvc-codex/revisar-y-compilar-apk-de-vvc-edge-gatekeeper-580ize
        # Resolución del conflicto: Gradle 8.2.2 no existe; 8.2.1 es la versión válida para este pipeline.
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.2.1

        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.2
 main

      - name: Clean and Compile App
        run: |
          chmod +x gradlew
          ./gradlew clean :app:assembleDebug --no-daemon --stacktrace --warning-mode all
