name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Hotfix Manus Gradle Versions
      run: |
        echo "=== CORRIGIENDO COMPATIBILIDAD DE GRADLE ==="
        sed -i 's/version "8.2.2"/version "8.1.4"/g' build.gradle.kts
        sed -i 's/version "1.9.22"/version "1.8.10"/g' build.gradle.kts

    - name: Setup Gradle Environment
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.1.1

    - name: Clean and Compile App with Log Interception
      run: |
        echo "=== EJECUTANDO COMPILACIÓN CONTROLADA ==="
        # Ejecutamos la tarea redirigiendo la salida para filtrar únicamente los errores reales de código
        ./gradlew :app:assembleDebug --no-daemon > build_output.log 2>&1 || true
        
        echo "=== FILTRANDO ERRORES DE COMPILACIÓN DE KOTLIN ==="
        grep -E "e: |.*kt:[0-9]+" build_output.log || tail -n 100 build_output.log
        
        # Forzar el fallo del paso si el archivo APK no se generó para que el pipeline no mienta
        if [ ! -f app/build/outputs/apk/debug/app-debug.apk ] && [ ! -f **/build/outputs/apk/debug/*.apk ]; then
           echo "La compilación falló. Revisar los errores de Kotlin impresos arriba."
           exit 1
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vvc-edge-gatekeeper-debug
        path: "**/build/outputs/apk/debug/*.apk"
        retention-days: 7
        
